<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reserva Escolar</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>📚 Reserva Escolar</h1>

        <p>
            <p>
    Reserve equipamentos da escola de forma rápida e organizada.
</p>
        </p>

        <nav>
            <a href="#equipamentos">Equipamentos</a>
            <a href="#reserva">Reservar</a>
            <a href="#reservas">Minhas reservas</a>
        </nav>
    </header>


    <main>

        <!-- 1. EQUIPAMENTOS -->

        <section id="equipamentos">

            <h2>1. Equipamentos</h2>

            <div class="filtros">

                <input
                    type="search"
                    id="busca"
                    placeholder="Pesquisar equipamento"
                >

                <select id="categoria">

                    <option value="todas">
                        Todas as categorias
                    </option>

                    <option value="Informática">
                        Informática
                    </option>

                    <option value="Audiovisual">
                        Audiovisual
                    </option>

                    <option value="Laboratório">
                        Laboratório
                    </option>

                </select>

            </div>


            <div id="lista-equipamentos"></div>

            <p id="sem-equipamentos">
                Nenhum equipamento encontrado.
            </p>

        </section>


        <!-- 2. RESERVA -->

        <section id="reserva">

            <h2>2. Fazer reserva</h2>

            <form id="formulario">

                <label for="equipamento">
                    Equipamento
                </label>

                <select id="equipamento" required>
                    <option value="">
                        Escolha um equipamento
                    </option>
                </select>


                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Seu nome"
                    minlength="3"
                    required
                >


                <label for="data">
                    Data
                </label>

                <input
                    type="date"
                    id="data"
                    required
                >


                <label for="horario">
                    Horário
                </label>

                <select id="horario" required>

                    <option value="">
                        Escolha um horário
                    </option>

                    <option>
                        08:00 - 09:00
                    </option>

                    <option>
                        09:00 - 10:00
                    </option>

                    <option>
                        10:00 - 11:00
                    </option>

                    <option>
                        11:00 - 12:00
                    </option>

                    <option>
                        13:00 - 14:00
                    </option>

                    <option>
                        14:00 - 15:00
                    </option>

                    <option>
                        15:00 - 16:00
                    </option>

                    <option>
                        16:00 - 17:00
                    </option>

                    <option>
                        Período da manhã
                    </option>

                    <option>
                        Período da tarde
                    </option>

                    <option>
                        Dia inteiro
                    </option>

                </select>


                <div class="botoes">

                    <button type="submit">
                        Reservar
                    </button>

                    <button
                        type="reset"
                        class="limpar"
                    >
                        Limpar
                    </button>

                </div>

            </form>

        </section>


        <!-- 3. RESERVAS -->

        <section id="reservas">

            <h2>3. Minhas reservas</h2>

            <div id="lista-reservas"></div>

            <p id="sem-reservas">
                Você ainda não possui reservas.
            </p>

        </section>

    </main>


    <footer>
        <p>Projeto acadêmico - Reserva Escolar</p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
